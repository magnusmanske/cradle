<template id='shex-page-template'>
<div class='container'>
    <div v-if='error_message' class='alert alert-danger mt-3' role='alert'>{{error_message}}</div>
    <div v-else-if='loading==true' class='my-4 text-muted'>
        <span class='cradle-spinner'></span> <i tt='loading'></i>
    </div>
    <div v-else>
        <div class='d-flex align-items-baseline mt-3'>
            <h1 class='mb-0'>{{getShExLabel}}</h1>
            <span class='badge badge-warning ml-2'>Experimental</span>
        </div>
        <p v-if='getShExDesc' class='text-muted'>{{getShExDesc}}</p>
        <ul class='list-group mb-3'>
            <li v-for='f in fields' :key='f.key' class='list-group-item cradle-form-row'>
                <div class='cradle-form-prop'>
                    <template v-if='f.is_lad'><div :tt='f.key'></div></template>
                    <template v-else><wd-link :item='f.key' :language='tt.language'></wd-link></template>
                    <span v-if='f.mandatory' class='cradle-required' tt_title='mandatory'>*</span>
                </div>
                <div class='cradle-form-values'>
                    <div v-for='(v,num) in data[f.key]' :key='v.vue_key' class='cradle-form-value'>
                        <prop-value :original='v' :num='num' :prop='f.key' :pv='f.pv' @datachanged='onDataChanged($event)'></prop-value>
                        <button v-if='num+1==data[f.key].length' type='button' class='btn btn-sm btn-outline-success cradle-icon-btn' title='Add value' aria-label='Add value' @click.prevent='onAddElement(f.key)'>+</button>
                        <button v-if='data[f.key].length>1' type='button' class='btn btn-sm btn-outline-danger cradle-icon-btn' title='Remove value' aria-label='Remove value' @click.prevent='onRemoveElement(f.key,num)'>&minus;</button>
                    </div>
                </div>
            </li>
        </ul>
        <div v-if='widar.is_logged_in'>
            <button v-if='can_create_new_item' class='btn btn-primary' tt='create_new_item' @click.prevent='doCreateItem'></button>
            <template v-else>
                <div v-for='(msg,idx) in warning_messages' :key='idx' class='cradle-warning'>{{msg}}</div>
            </template>
        </div>
        <div v-else class='cradle-warning' tt='log_into_widar'></div>
        <div v-if='created_items.length>0' class='mt-4'>
            <h2 class='h6' tt='last_items_created'></h2>
            <div v-for='q in created_items' :key='q' class='cradle-created'>
                <wd-link :item='q'></wd-link>
            </div>
        </div>
    </div>
</div>
</template>

<script>
'use strict';

let ShexPage = Vue.extend ( {
    mixins : [ CradleFormMixin ] ,
    props : [ 'e' ] ,
    data : function () { return { j:{} , create_item_log_method:'item from shex' } } ,
    created : function () {
        var me = this ;
        if ( typeof me.e == 'undefined' || me.e == '' ) {
            me.loading = false ;
            me.error_message = 'No schema specified.' ;
            return ;
        }

        me.j = {} ;
        me.loadEntitySchema ( function ( j ) {
            let t = ( j && j.schemaText ) || '' ;
            me.j = j || {} ;

            let m = t.match ( /\n *start\s*=\s*@<\s*(.+?)\s*>/ ) ;
            if ( m == null ) {
                me.loading = false ;
                me.error_message = 'No start shape found in schema ' + me.e + '.' ;
                return ;
            }
            let start = m[1] ;

            // Strip comments (ShEx "..." ) and collapse the schema to one line
            t = t.replace ( /(^|[^<])#[^\n]*/g , '$1' ) ;
            t = t.replace ( /\n/g , ' ' ) ;

            let s = { labels:{} , props:{} } ;
            let to_load = [] ;
            // Find the start shape and extract its body by matching braces, so
            // cardinalities such as {2} or {1,3} inside the body are kept.
            const shape_re = RegExp('<([^/<>]+)>(?: EXTRA .*?)?\w*\{','gi') ;
            while ( (m = shape_re.exec(t)) !== null ) {
                if ( m[1] != start ) continue ;
                let depth = 1 ;
                let i = shape_re.lastIndex ;
                while ( i < t.length && depth > 0 ) {
                    if ( t[i] == '{' ) depth++ ;
                    else if ( t[i] == '}' ) depth-- ;
                    if ( depth == 0 ) break ;
                    i++ ;
                }
                let parts = t.substring ( shape_re.lastIndex , i ).split(';') ;
                $.each ( parts , function ( dummy , part ) {
                    part = part.trim() ;
                    if ( part == '' ) return ;
                    let n = part.match(/^wdt:(P\d+)\s*(.*)$/) ;
                    if ( n == null ) return ;

                    let prop = n[1] ;
                    let rest = n[2] ;
                    to_load.push ( prop ) ;
                    if ( typeof s.props[prop] == 'undefined' ) s.props[prop] = { min:0 } ;
                    let p = s.props[prop] ;

                    // These are not honored right now, but...
                    if ( /\+$/.test(rest) ) p.min = 1 ;
                    else if ( /\*$/.test(rest) ) p.min = 0 ;
                    if ( /\?$/.test(rest) ) {
                        p.min = 0 ;
                        p.max = 1 ;
                        p.from = '?' ;
                    }
                    n = rest.match(/\{\s*(\d+)\s*\}/) ;
                    if ( n != null ) {
                        p.min = n[1]*1 ;
                        p.max = n[1]*1 ;
                        p.from = '{}' ;
                    }
                    n = rest.match(/\{\s*(\d+)\s*,\s*(\d+)\s*\}/) ;
                    if ( n != null ) {
                        p.min = n[1]*1 ;
                        p.max = n[2]*1 ;
                        p.from = '{,}' ;
                    }

                    if ( p.min > 0 ) p.mandatory = true ;

                    n = rest.match(/\[\s*(.+?)\s*\]/) ;
                    if ( n != null ) {
                        let items = n[1].replace(/\bwd:/g,' ').replace(/[\s,]+/g,' ').trim() ;
                        items = items == '' ? [] : items.split(' ') ;
                        items = $.grep ( items , function ( q ) { return /^Q\d+$/.test ( q ) ; } ) ;
                        if ( items.length > 0 ) {
                            to_load = to_load.concat(items) ;
                            p.softselect = items.join(',') ;
                        }
                    }
                } ) ;
            }

            if ( Object.keys ( s.props ).length == 0 ) {
                me.loading = false ;
                me.error_message = 'No properties found in schema ' + me.e + '.' ;
                return ;
            }

            me.s = s ;
            me.initFormData() ;
            me.beginLoading() ;
            wd.getItemBatch ( to_load , me.finishLoading , 'labels|datatype' ) ;
        } , function ( msg ) {
            me.loading = false ;
            me.error_message = msg ;
        } ) ;
    } ,
    updated : function () { tt.updateInterface(this.$el) ; } ,
    mounted : function () { tt.updateInterface(this.$el) ; } ,
    methods : {
        loadEntitySchema : function ( callback , error_callback ) {
            let me = this ;
            $.ajax ( {
                url : config.wikibase_api ,
                data : {
                    action:'parse',
                    page:'EntitySchema:'+me.e,
                    prop:'wikitext' ,
                    format:'json' ,
                    origin:'*'
                } ,
                dataType : 'json' ,
                timeout : 15000
            } )
            .done ( function ( d ) {
                try {
                    if ( typeof d.parse == 'undefined' || typeof d.parse.wikitext == 'undefined' ) throw new Error ( 'not found' ) ;
                    let j = JSON.parse ( d.parse.wikitext['*'] ) ;
                    if ( typeof j.schemaText != 'string' ) throw new Error ( 'no schemaText' ) ;
                    callback ( j ) ;
                } catch ( e ) {
                    error_callback ( 'Schema ' + me.e + ' could not be read.' ) ;
                }
            } )
            .fail ( function () {
                error_callback ( 'Schema ' + me.e + ' could not be loaded.' ) ;
            } ) ;
        } ,
    } ,
    computed : {
        getShExLabel : function () {
            let labels = this.j.labels || {} ;
            return labels[tt.language] || labels['en'] || this.e ;
        } ,
        getShExDesc : function () {
            let descs = this.j.descriptions || {} ;
            return descs[tt.language] || descs['en'] || '' ;
        } ,
    } ,
    template:'#shex-page-template'
} ) ;
</script>
