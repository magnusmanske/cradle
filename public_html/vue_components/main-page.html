<template id='main-page-template'>
<div class='container'>
    <div class='lead'>
        <blockquote class="blockquote" style='margin-left:2rem;'>
            <p class="mb-0" tt='quote'></p>
            <footer class="blockquote-footer"><cite tt='proverb'></cite></footer>
        </blockquote>
        <div>
            <span tt='main_blurb'></span>
            <a :href='config.wikibase_url+config.source_page' class='wikidata' target='_blank' rel='noopener' tt='here'></a>
        </div>
        <form @submit='goShEx' class="form-inline align-items-center">
            <span tt='shex_blurb'></span> &nbsp;
            <input v-model='shex' tt_placeholder='pl_shex' class='form-control' :class='{"is-invalid":shex_error}' aria-label='ShEx schema ID' />
            <input type='submit' tt_value='go_shex' class='btn btn-outline-primary ml-1' />
        </form>
        <div v-if='shex_error' class='text-danger small mt-1'>Enter a schema ID, e.g. E10.</div>
    </div>

    <input v-model='filter' type='search' class='form-control mt-3' placeholder='Filter forms&hellip;' aria-label='Filter forms' v-if='hasSubjects'>
    <ul class='list-group mt-2'>
        <li v-for='s in filteredSubjects' :key='s.key' class='list-group-item'>
            <router-link :to='"/subject/"+s.key'>{{s.label}}</router-link>
        </li>
        <li v-if='filteredSubjects.length==0' class='list-group-item text-muted'>
            No matching forms.
        </li>
    </ul>
</div>
</template>

<script>
'use strict';

let MainPage = Vue.extend ( {
    props : [] ,
    data : function () { return { shex:'' , shex_error:false , filter:'' } } ,
    created : function () {
    } ,
    updated : function () { tt.updateInterface(this.$el) ; } ,
    mounted : function () { tt.updateInterface(this.$el) ; } ,
    methods : {
        goShEx : function () {
            let e = String ( this.shex ).trim().replace ( /^.*EntitySchema:/i , '' ).toUpperCase() ;
            if ( !/^E\d+$/.test ( e ) ) {
                this.shex_error = true ;
                return false ;
            }
            this.shex_error = false ;
            this.$router.push ( '/shex/'+e ) ;
            return false ;
        }
    } ,
    computed : {
        hasSubjects : function () {
            return Object.keys ( subjects ).length > 0 ;
        } ,
        filteredSubjects : function () {
            let q = String ( this.filter ).trim().toLowerCase() ;
            let ret = [] ;
            $.each ( subjects , function ( key , s ) {
                let label = s.labels[tt.language] || s.labels['en'] || key.replace(/_/g,' ') ;
                if ( q != '' && label.toLowerCase().indexOf(q) == -1 && key.indexOf(q) == -1 ) return ;
                ret.push ( { key:key , label:label } ) ;
            } ) ;
            return ret ;
        }
    } ,
    template:'#main-page-template'
} ) ;
</script>
