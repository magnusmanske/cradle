<template id='subject-page-template'>
<div class='container'>
    <div v-if='typeof subjects[subject]=="undefined"' class='alert alert-warning mt-3'>
        No form named &ldquo;{{subject}}&rdquo;.
    </div>
    <div v-else-if='error_message' class='alert alert-danger mt-3' role='alert'>{{error_message}}</div>
    <div v-else-if='loading==true' class='my-4 text-muted'>
        <span class='cradle-spinner'></span> <i tt='loading'></i>
    </div>
    <div v-else>
        <h1 class='mt-3'>{{getSubjectLabel}}</h1>
        <ul class='list-group mb-3'>
            <li v-for='f in fields' :key='f.key' class='list-group-item cradle-form-row'>
                <div class='cradle-form-prop'>
                    <template v-if='f.is_lad'><div :tt='f.key'></div></template>
                    <template v-else><wd-link :item='f.key' :language='tt.language'></wd-link></template>
                    <span v-if='f.mandatory' class='cradle-required' tt_title='mandatory'>*</span>
                </div>
                <div class='cradle-form-values'>
                    <div v-for='(v,num) in data[f.key]' :key='v.vue_key' class='cradle-form-value'>
                        <prop-value :original='v' :num='num' :prop='f.key' :pv='f.pv' @datachanged='onDataChanged($event)'></prop-value>
                        <button v-if='num+1==data[f.key].length' type='button' class='btn btn-sm btn-outline-success cradle-icon-btn' title='Add value' aria-label='Add value' @click.prevent='onAddElement(f.key)'>+</button>
                        <button v-if='data[f.key].length>1' type='button' class='btn btn-sm btn-outline-danger cradle-icon-btn' title='Remove value' aria-label='Remove value' @click.prevent='onRemoveElement(f.key,num)'>&minus;</button>
                    </div>
                </div>
            </li>
        </ul>
        <div v-if='widar.is_logged_in'>
            <button v-if='can_create_new_item' class='btn btn-primary' tt='create_new_item' @click.prevent='doCreateItem'></button>
            <template v-else>
                <div v-for='(msg,idx) in warning_messages' :key='idx' class='cradle-warning'>{{msg}}</div>
            </template>
        </div>
        <div v-else class='cradle-warning' tt='log_into_widar'></div>
        <div v-if='created_items.length>0' class='mt-4'>
            <h2 class='h6' tt='last_items_created'></h2>
            <div v-for='q in created_items' :key='q' class='cradle-created'>
                <wd-link :item='q'></wd-link>
            </div>
        </div>
    </div>
</div>
</template>

<script>
'use strict';

let SubjectPage = Vue.extend ( {
    mixins : [ CradleFormMixin ] ,
    props : [ 'subject' , 'q' ] ,
    data : function () { return { create_item_log_method:'item from subject' } } ,
    created : function () {
        var me = this ;
        if ( typeof subjects[me.subject] == 'undefined' ) { me.loading = false ; return ; }
        me.s = subjects[me.subject] ;
        me.initFormData() ;
        if ( typeof me.q != 'undefined' && me.q != '' ) me.initializeDataFromItem ( me.q ) ;

        // Pre-load the properties (for labels/datatypes) and selectable items
        let to_load = Object.keys ( me.s.props ) ;
        $.each ( me.s.props , function ( prop , pv ) {
            if ( typeof pv.hardselect != 'undefined' ) to_load = to_load.concat(pv.hardselect.split(',')) ;
            if ( typeof pv.softselect != 'undefined' ) to_load = to_load.concat(pv.softselect.split(',')) ;
        } ) ;
        me.beginLoading() ;
        wd.getItemBatch ( to_load , me.finishLoading , 'labels|datatype' ) ;
    } ,
    updated : function () { tt.updateInterface(this.$el) ; } ,
    mounted : function () { tt.updateInterface(this.$el) ; } ,
    computed : {
        getSubjectLabel : function () {
            var me = this ;
            if ( me.s.labels && typeof me.s.labels[tt.language] != 'undefined' ) return me.s.labels[tt.language] ;
            return String(me.subject).replace(/_/g,' ') ;
        }
    } ,
    template:'#subject-page-template'
} ) ;
</script>
